name: Bot Doble Falta Tenis

on:
  schedule:
    # 8:30 AM ART -> 11:30 UTC (Agenda)
    - cron: '0 11 * * *'
    
    # 9:00 AM ART (Lunes) -> 12:00 UTC (Ranking)
    - cron: '0 12 * * 1'
    
    # 12:30 PM ART -> 15:30 UTC (Final Incremental 1)
    - cron: '30 15 * * *'
    
    # 18:00 PM ART -> 21:00 UTC (Final Incremental 2)
    - cron: '0 21 * * *'
    
    # Cada 60 min (Live) - Ajustado para no pisar los horarios fijos
    - cron: '0 13,14,16,17,18,19,20,22,23 * * *'
    - cron: '0 0-1 * * *'
    
    # 23:00 ART -> 02:00 UTC (Final Completo)
    - cron: '0 2 * * *'
  
  workflow_dispatch: # Permite ejecutarlo manualmente desde GitHub

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
            persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Determine Mode
        id: mode
        run: |
          HOUR=$(date +%H)
          DAY=$(date +%u) # 1=Lunes, 7=Domingo
          echo "Current UTC Hour: $HOUR"
          echo "Current Day of Week: $DAY"
          
          if [ "$HOUR" == "11" ]; then
            echo "run_mode=agenda" >> $GITHUB_OUTPUT
            echo "run_flags=" >> $GITHUB_OUTPUT
          elif [ "$HOUR" == "12" ] && [ "$DAY" == "1" ]; then
            echo "run_mode=ranking" >> $GITHUB_OUTPUT
            echo "run_flags=" >> $GITHUB_OUTPUT
          elif [ "$HOUR" == "02" ]; then
            echo "run_mode=final" >> $GITHUB_OUTPUT
            echo "run_flags=" >> $GITHUB_OUTPUT
          elif [ "$HOUR" == "15" ] || [ "$HOUR" == "21" ]; then
            echo "run_mode=final" >> $GITHUB_OUTPUT
            echo "run_flags=--incremental" >> $GITHUB_OUTPUT
          else
            echo "run_mode=live" >> $GITHUB_OUTPUT
            echo "run_flags=" >> $GITHUB_OUTPUT
          fi

      - name: Run Bot
        env:
          TENNIS_API_KEY: ${{ secrets.TENNIS_API_KEY }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVERS: ${{ secrets.EMAIL_RECEIVERS }}
        run: python main.py --mode ${{ steps.mode.outputs.run_mode }} ${{ steps.mode.outputs.run_flags }}

      - name: Commit Cache
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add jugadores_cache.json reportados_cache.json || true
          git commit -m "Update caches [skip ci]" || echo "No changes to commit"
          git push || echo "No changes to push"
